services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: corridor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: January@02
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata: